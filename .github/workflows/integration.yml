name: Live integration

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

jobs:
  guardrail:
    runs-on: macos-latest
    env:
      BRANTA_INTEGRATION_METRICS_TOKEN: ${{ secrets.BRANTA_INTEGRATION_METRICS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Require integration metrics token
        run: |
          if [ -z "$BRANTA_INTEGRATION_METRICS_TOKEN" ]; then
            echo "Set the BRANTA_INTEGRATION_METRICS_TOKEN Actions secret to the same value as Guardrail."
            exit 1
          fi
      - name: Example QR codes against staging and production
        run: swift test --filter IntegrationTests
